version: '2.2'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ai_agent_api
    env_file:
      - .env
    environment:
      - CLI_BRIDGE_URL=http://cli-bridge:9876
      - ATTACHMENT_HOST_ROOT=${ATTACHMENT_HOST_ROOT:-}
    ports:
      - '8010:8010'
    volumes:
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ./data:/app/data
      # NOTE: Windows local-dev — host repo mount and ~/.ssh mount removed.
      # They are only needed for the AI pipeline (cloning local repos + git
      # SSH auth), which the core stack does not exercise. Re-add for full AI.
      # Persist fastembed model cache across container recreates so the
      # ~120MB MiniLM download only happens once on this machine.
      - fastembed_cache:/root/.cache/fastembed
      # Shared repo workspace — same path is mounted into cli-bridge so
      # Claude (in the bridge) and the worker see the same checkout.
      - agena_repos:/workspace
    # NOTE: alembic upgrade head runs on every (re)start. The migrations
    # are written to be idempotent (each one guards CREATE TABLE / ADD
    # COLUMN with an inspect() check), so this is safe to repeat. We
    # used to only run migrations from start.sh which meant a plain
    # `docker-compose restart backend` (or the `--reload` watcher
    # picking up a fresh checkout) would leave the schema lagging
    # behind the model and every endpoint that touched the affected
    # table would 500. Running it at container start time fixes that.
    command: >
      bash -c "pip install -q -e packages/core -e packages/models -e packages/services
      -e packages/agents -e packages/api -e packages/worker
      && (alembic upgrade head || echo 'WARN: alembic upgrade head failed; starting uvicorn anyway')
      && uvicorn agena_api.api.main:app --host 0.0.0.0 --port 8010 --reload"
    depends_on:
      - mysql
      - redis
      - qdrant
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ai_agent_worker
    env_file:
      - .env
    environment:
      - CLI_BRIDGE_URL=http://cli-bridge:9876
      - ATTACHMENT_HOST_ROOT=${ATTACHMENT_HOST_ROOT:-}
    volumes:
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ./data:/app/data
      # NOTE: Windows local-dev — host repo mount and ~/.ssh mount removed
      # (only needed for the full AI pipeline). See backend service above.
      # Persist fastembed model cache across container recreates so the
      # ~120MB MiniLM download only happens once on this machine.
      - fastembed_cache:/root/.cache/fastembed
      # Shared repo workspace — same path is mounted into cli-bridge so
      # Claude (in the bridge) and the worker see the same checkout.
      - agena_repos:/workspace
    command: >
      bash -c "pip install -q -e packages/core -e packages/models -e packages/services
      -e packages/agents -e packages/api -e packages/worker
      && python -m agena_worker.workers.redis_worker"
    depends_on:
      - mysql
      - redis
      - qdrant
    restart: unless-stopped

  # CLI bridge — containerized for Windows (host CLIs don't run on win32).
  # Runs Claude Code inside Docker; auth comes from the host ~/.claude
  # credentials mounted read-only and copied in by the entrypoint.
  cli-bridge:
    build:
      context: .
      dockerfile: docker/Dockerfile.bridge
    container_name: ai_agent_cli_bridge
    environment:
      - AGENA_BACKEND_URL=http://backend:8010
      # Allow Claude Code's --dangerously-skip-permissions while running as
      # root inside the container (it otherwise refuses for root/sudo).
      - IS_SANDBOX=1
    volumes:
      # Host Claude credentials (read-only) — entrypoint copies them in.
      - "${HOST_CLAUDE_DIR:-C:/Users/hasan.ozturk/.claude}:/host-claude:ro"
      # Shared repo workspace — same mount/path as backend & worker.
      - agena_repos:/workspace
    expose:
      - '9876'
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_agent_frontend
    env_file:
      - frontend/.env.example
      - frontend/.env.local
    ports:
      - '3010:3010'
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -lc "npm install --no-audit --no-fund && npm run dev -- -p 3010"
    depends_on:
      - backend
    restart: unless-stopped

  frontend_blue:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_agent_frontend_blue
    env_file:
      - frontend/.env.example
    ports:
      - '3011:3010'
    # Use Dockerfile CMD (npm run start) → production build with content-hashed chunks.
    # Do NOT override with `next dev` in prod: dev mode uses stable filenames which defeats CDN cache-busting.
    depends_on:
      - backend
    restart: unless-stopped

  frontend_green:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ai_agent_frontend_green
    env_file:
      - frontend/.env.example
    ports:
      - '3012:3010'
    depends_on:
      - backend
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: ai_agent_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ai_agent_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_agent_redis
    ports:
      - '6380:6379'
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: ai_agent_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - '6333:6333'
      - '6334:6334'
    restart: unless-stopped

volumes:
  mysql_data:
  qdrant_data:
  fastembed_cache:
  agena_repos:
